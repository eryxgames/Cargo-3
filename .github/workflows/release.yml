# Release: push a tag like v2.2.0 and this workflow
#   1. runs the quick checks,
#   2. builds cargo3.exe for Windows (PyInstaller, one file, no Python needed),
#   3. makes a GitHub release: .github/release-intro.md ({version} filled in), then the notes for
#      that version from CHANGELOG.md,
#   4. pushes both builds to itch.io with butler (if the BUTLER_API_KEY secret is set).
#
# A trial run without a tag: Actions > Release > Run workflow. It does 1 and 2, packs both zips and
# smoke-tests them, and leaves them (and the release notes) as the run's artifacts; no release, no
# itch.io.
#
# The tag must match VERSION in game/__init__.py, and CHANGELOG.md needs a "## 2.2.0" section.
# itch.io channels: "windows" (cargo3.exe) and "linux-mac" (the Python game, needs Python 3.8+;
# also runs on Windows and in Termux). Set ITCH_PROJECT below to the page's user/slug.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ITCH_PROJECT: eryxgames/cargo-3
  PYTHON_VERSION: "3.12"
  # what the Python build ships (the story sources and tools stay in the repository)
  SHIP: cargo3.py game kit story/cargo3.game.json music themes README.md CHANGELOG.md

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Tag matches the game's version
        run: |
          game=$(python3 -c "import re; print(re.search(r'^VERSION = \"(.+)\"', open('game/__init__.py').read(), re.M).group(1))")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "tag $tag, game/__init__.py $game"
            test "$tag" = "$game"
          else
            echo "trial run (no tag), game/__init__.py $game"
          fi
          grep -q "^## $game\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $game' section"; exit 1; }
      - name: Quick checks
        run: bash tools/check.sh quick

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build cargo3.exe
        run: |
          python -m pip install --upgrade pyinstaller
          pyinstaller --onefile --console --name cargo3 --icon favicon.ico --exclude-module pkg_resources --exclude-module setuptools --add-data "story/cargo3.game.json;story" --add-data "music;music" --add-data "themes;themes" --add-data "kit/style;kit/style" cargo3.py
      - name: Smoke test (start, new game, autosave, clean exit; UTF-8 and cp1252 output)
        run: python tools/smoke.py dist/cargo3.exe
      - name: Pack
        shell: bash
        run: |
          mkdir -p build/windows
          cp dist/cargo3.exe README.md CHANGELOG.md build/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows

  release:
    needs: [check, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: build/windows
      - name: Pack the Python version
        run: |
          mkdir -p build/python
          cp -r --parents $SHIP build/python/
          find build/python -name __pycache__ -prune -exec rm -rf {} +
          version=$(python3 -c "import re; print(re.search(r'^VERSION = \"(.+)\"', open('game/__init__.py').read(), re.M).group(1))")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          (cd build/windows && zip -qr "../../cargo3-$version-windows.zip" .)
          (cd build/python && zip -qr "../../cargo3-$version-python.zip" .)
          bash tools/release_notes.sh "$version" > notes.md
          cat notes.md
      - name: The Python build starts on its own
        run: python3 tools/smoke.py python3 build/python/cargo3.py
      - name: Keep the trial run's zips and notes
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: trial-${{ env.VERSION }}
          path: |
            cargo3-*.zip
            notes.md
      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "cargo3-$VERSION-windows.zip" "cargo3-$VERSION-python.zip" \
            --title "Cargo 3 $VERSION" --notes-file notes.md
      - name: Push to itch.io
        if: github.ref_type == 'tag'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "No BUTLER_API_KEY secret: skipping itch.io"; exit 0; fi
          curl -fsSL --retry 5 -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V
          ./butler/butler push build/windows "$ITCH_PROJECT:windows" --userversion "$VERSION"
          ./butler/butler push build/python "$ITCH_PROJECT:linux-mac" --userversion "$VERSION"
